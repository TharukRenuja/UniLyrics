[workspace]
members = ["crates/unilyrics", "crates/unilyrics-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
authors = ["Tharuk Renuja"]
repository = "https://github.com/TharukRenuja/UniLyrics"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
roxmltree = "=0.20.0"
